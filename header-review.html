<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Header Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Working tool for Bob: one business at a time, its header shown at three real screen sizes. */
  :root {
    --ink: #1C2228; --ink-2: #3A444D; --steel: #5B6670; --line: #D8DCE0; --paper: #F4F5F6; --white: #FFFFFF;
    --go: #1E5B31; --pick: #E8891C;
    --display: "Archivo", "Arial Narrow", sans-serif; --body: "Hanken Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--body); }
  header.bar { position: sticky; top: 0; z-index: 5; background: var(--ink); color: var(--white); }
  .bar .in { max-width: 1240px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .bar h1 { font: 800 22px/1 var(--display); font-stretch: 85%; margin: 0; }
  .bar .prog { color: #C9D0D6; font-variant-numeric: tabular-nums; }
  .bar .grow { flex: 1; }
  button { font: 600 14px/1 var(--body); border-radius: 6px; border: 1.5px solid var(--line); background: var(--white); color: var(--ink); padding: 10px 14px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--pick); outline-offset: 2px; }
  .bar button { background: transparent; color: var(--white); border-color: #56616B; }
  .bar button.primary { background: var(--pick); border-color: var(--pick); color: #1C1205; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left, 0px)) 80px; }
  .biz { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .biz h2 { font: 800 34px/1.05 var(--display); font-stretch: 82%; margin: 0; }
  .biz .meta { color: var(--steel); }
  .biz .done { font-weight: 700; color: var(--go); }
  .choices { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 6px; }
  .choice { padding: 6px; display: grid; gap: 6px; justify-items: start; text-align: left; }
  .choice .thumb { width: 168px; aspect-ratio: 16 / 9; border-radius: 4px; background: #CFD5DA center/cover no-repeat; }
  .choice[aria-pressed="true"] { border-color: var(--pick); box-shadow: 0 0 0 2px var(--pick); }
  .choice small { color: var(--steel); font-weight: 600; }
  .hint { color: var(--steel); margin: 4px 0 18px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .actions .use { background: var(--go); border-color: var(--go); color: var(--white); }
  .frames { display: grid; gap: 22px; }
  .frame h3 { font: 700 15px/1.2 var(--body); margin: 0 0 6px; color: var(--ink-2); }
  .frame .box { position: relative; width: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--white); }
  .frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: var(--white); }
  textarea#out { width: 100%; min-height: 120px; font: 13px/1.4 ui-monospace, monospace; margin-top: 10px; }
  .empty { padding: 60px 0; font-size: 18px; }
</style>
</head>
<body>
<header class="bar"><div class="in">
  <h1>Header review</h1>
  <span class="prog" id="prog"></span>
  <span class="grow"></span>
  <button id="filter" type="button">Show: not reviewed</button>
  <button id="copy" class="primary" type="button">Copy my picks</button>
</div></header>
<main id="main"></main>
<script>
(function () {
  var KEY = "truaido-header-picks";
  var SIZES = [["Small laptop", 1366, 660], ["Desktop", 1600, 820], ["Wide monitor", 1920, 940]];
  var picks = {};
  try { picks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { picks = {}; }
  var list = [], idx = 0, onlyOpen = true, data = null, choice = -1;
  var main = document.getElementById("main");

  function save() { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function cld(u, t) {
    return /res\.cloudinary\.com\/[^/]+\/image\/upload\//.test(u)
      ? u.replace(/\/image\/upload\/(?:[^/]*\/)?(?:f_auto,q_auto\/)?(v\d+\/)/, "/image/upload/" + t + "/f_auto,q_auto/$1") : u;
  }
  function visible() { return onlyOpen ? list.filter(function (r) { return !(r.s in picks); }) : list; }
  function progress() {
    var done = list.filter(function (r) { return r.s in picks; }).length;
    var kept = list.filter(function (r) { return picks[r.s] >= 0; }).length;
    document.getElementById("prog").textContent = done + " of " + list.length + " reviewed, " + kept + " using their own photo";
  }

  function show() {
    progress();
    var rows = visible();
    if (!rows.length) { main.innerHTML = '<p class="empty">' + (onlyOpen ? "All reviewed. Click Copy my picks and paste them to Claude." : "Nothing to show.") + "</p>"; return; }
    if (idx >= rows.length) idx = rows.length - 1;
    if (idx < 0) idx = 0;
    var r = rows[idx];
    fetch("/p/data/" + r.s + ".json").then(function (x) { return x.json(); }).then(function (d) {
      data = d;
      var own = d.hero && d.hero.source === "google" ? d.hero.url : "";
      var photos = (own ? [own] : []).concat(d.gallery || []).slice(0, 5);
      choice = r.s in picks ? picks[r.s] : -1;
      var opts = [{ i: -1, label: "Stock photo", img: "/images/stock/" + stockName(d.trade) + ".webp" }].concat(photos.map(function (u, i) {
        return { i: i, label: (i === 0 && own ? "Their photo 1 (import's pick)" : "Their photo " + (i + 1)), img: cld(u, "c_fill,g_auto,w_336,h_189") };
      }));
      main.innerHTML =
        '<div class="biz"><h2>' + esc(d.company) + '</h2><span class="meta">' + esc(d.trade_label) + " in " + esc(d.city) + ", buyer score " + r.b +
        " (" + (idx + 1) + " of " + rows.length + ")</span>" + (r.s in picks ? '<span class="done">Reviewed: ' + (picks[r.s] < 0 ? "stock" : "photo " + (picks[r.s] + 1)) + "</span>" : "") + "</div>" +
        '<div class="choices">' + opts.map(function (o, k) {
          return '<button type="button" class="choice" data-i="' + o.i + '" aria-pressed="' + (o.i === choice) + '"><span class="thumb" style="background-image:url(\'' + esc(o.img) + '\')"></span><small>' + k + ". " + esc(o.label) + "</small></button>";
        }).join("") + "</div>" +
        '<p class="hint">Pick a header, check it at all three sizes below, then click Use this header. Keys: 0 to ' + photos.length + ' pick, Enter saves and moves on, arrow keys move back and forward.</p>' +
        '<div class="actions"><button type="button" class="use" id="use">Use this header</button><button type="button" id="prev">Back</button><button type="button" id="next">Skip</button></div>' +
        '<div class="frames">' + SIZES.map(function (s, k) {
          return '<div class="frame"><h3>' + s[0] + " (" + s[1] + " px wide)</h3><div class=\"box\" data-w=\"" + s[1] + '" data-h="' + s[2] + '"><iframe title="' + s[0] + ' view" loading="lazy" tabindex="-1"></iframe></div></div>';
        }).join("") + "</div>";
      main.querySelectorAll(".choice").forEach(function (b) { b.addEventListener("click", function () { setChoice(+b.dataset.i); }); });
      document.getElementById("use").addEventListener("click", use);
      document.getElementById("prev").addEventListener("click", function () { idx--; if (onlyOpen) idx = Math.max(0, idx); show(); });
      document.getElementById("next").addEventListener("click", function () { idx++; show(); });
      fit(); load();
    }).catch(function () { main.innerHTML = '<p class="empty">Could not load ' + esc(r.s) + ". Click Skip.</p>"; });
  }
  function stockName(t) {
    var m = { "stump-grinding": "tree-service" };
    var have = ["tree-service", "chimney", "septic", "hvac", "generator", "insulation", "pest-control", "garage-doors", "auto-glass", "welding"];
    return m[t] || (have.indexOf(t) >= 0 ? t : "general");
  }
  function setChoice(i) {
    choice = i;
    main.querySelectorAll(".choice").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.i === i)); });
    load();
  }
  function load() {
    var slug = visible()[idx].s;
    main.querySelectorAll(".frame iframe").forEach(function (f) {
      f.onload = function () {
        // Keep each preview on the first screen, as a visitor sees it on arrival.
        var n = 0, t = setInterval(function () { try { f.contentWindow.scrollTo(0, 0); } catch (e) {} if (++n > 24) clearInterval(t); }, 250);
      };
      f.src = "/p/index.html?b=" + encodeURIComponent(slug) + "&hdr=" + (choice < 0 ? "stock" : choice);
    });
  }
  function fit() {
    main.querySelectorAll(".frame .box").forEach(function (box) {
      var w = +box.dataset.w, h = +box.dataset.h, s = box.clientWidth / w, f = box.querySelector("iframe");
      f.style.width = w + "px"; f.style.height = h + "px"; f.style.transform = "scale(" + s + ")";
      box.style.height = Math.round(h * s) + "px";
    });
  }
  function use() {
    var r = visible()[idx];
    picks[r.s] = choice; save();
    if (!onlyOpen) idx++;
    show();
  }
  window.addEventListener("resize", fit);
  document.addEventListener("keydown", function (e) {
    if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
    if (/^[0-5]$/.test(e.key)) { var b = main.querySelectorAll(".choice")[+e.key]; if (b) b.click(); }
    else if (e.key === "Enter") { var u = document.getElementById("use"); if (u) { e.preventDefault(); u.click(); } }
    else if (e.key === "ArrowRight") { idx++; show(); }
    else if (e.key === "ArrowLeft") { idx = Math.max(0, idx - 1); show(); }
  });
  document.getElementById("filter").addEventListener("click", function () {
    onlyOpen = !onlyOpen; idx = 0;
    this.textContent = onlyOpen ? "Show: not reviewed" : "Show: all";
    show();
  });
  document.getElementById("copy").addEventListener("click", function () {
    var text = "HEADER PICKS " + JSON.stringify(picks);
    var done = function () { document.getElementById("copy").textContent = "Copied. Paste it to Claude"; };
    var fallback = function () {
      var t = document.getElementById("out");
      if (!t) { t = document.createElement("textarea"); t.id = "out"; t.readOnly = true; main.prepend(t); }
      t.value = text; t.select();
      document.getElementById("copy").textContent = "Select all in the box and copy";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  });
  fetch("/p/review-list.json").then(function (x) { return x.json(); }).then(function (rows) { list = rows; show(); })
    .catch(function () { main.innerHTML = '<p class="empty">Could not load the list.</p>'; });
})();
</script>
</body>
</html>
