<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Logo Review</title>
<style>
  :root { --ink: #1d2327; --muted: #69737a; --line: #dfe3e6; --ok: #1f7a3f; --bg: #f4f6f7; --bad: #b23a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  .top { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .top h1 { font-size: 18px; margin: 0; }
  .top p { margin: 0; color: var(--muted); flex: 1 1 320px; }
  .count { font-weight: 700; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button.main { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: 16px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 14px 12px 10px; position: relative; display: flex; flex-direction: column; gap: 10px; user-select: none; }
  .card.on { border-color: var(--ok); box-shadow: 0 0 0 3px rgba(31,122,63,.15); }
  .card.nologo { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(178,58,42,.15); }
  .card.nologo .logo { opacity: .35; }
  .pick { display: flex; gap: 6px; }
  .pick button { flex: 1; padding: 6px 8px; font-size: 13px; }
  .card.on .pick .b-name { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
  .card.nologo .pick .b-nologo { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
  .logo { height: 96px; display: flex; align-items: center; justify-content: center; }
  .logo img { max-height: 90px; max-width: 100%; object-fit: contain; }
  .logo .badge { border-radius: 10px; padding: 8px 10px; display: inline-flex; }
  .logo .badge img { max-height: 76px; }
  .meta { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
  .meta a { color: var(--muted); white-space: nowrap; }
  textarea { width: 100%; height: 90px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="top">
  <h1>Logo review</h1>
  <p><b>Has name</b>: the logo already spells out the business name, so the site shows the logo alone, bigger. <b>Name only</b>: the logo is cluttered (slogans, phone numbers, deals), so the site drops it and shows just the business name. Leave normal logos alone (logo plus typed name). <span class="count" id="count">0</span> marked of <span id="total">0</span>.</p>
  <button class="main" id="copy">Copy my picks</button>
  <textarea id="fallback" readonly></textarea>
</div>
<div class="grid" id="grid"></div>
<script>
(function () {
  var KEY = "truaido-logo-picks-v2";
  // Bob's first 48 "Has name" picks (pasted Oct 21), preloaded so a new preview link starts with them.
  var SEED = ["717-home-comfort-shippensburg", "717-mechanical-marietta", "a1-pest-harrisburg", "accurate-insulation-harrisburg", "aes-hearth-patio-camp-hill", "aes-hearth-patio-newville", "air-swap-heating-elizabethtown", "all-county-termite-lancaster", "anderson-masonry-canadensis", "arrow-auto-glass-harrisburg", "blackout-pest-lancaster", "britestone-autoglass-hummelstown", "britestone-autoglass-lancaster", "bsm-landscaping-mechanicsburg", "bw-hummelstown", "cc-insulation-bainbridge", "cmj-welding-harrisburg", "complete-chimney-factoryville", "complete-door-access-lititz", "county-line-pest-lancaster", "creek-hill-welding-ephrata", "dc-welding-elizabethtown", "eichelbergers-tree-harrisburg", "goods-tree-harrisburg", "goods-tree-manheim", "guttman-energy-lititz", "haven-mechanicals-ephrata", "home-climates-elizabethtown", "hoovertec-new-holland", "jk-stump-christiana", "jsl-mechanical-reinholds", "kesslers-auto-glass-carlisle", "keystone-property-hummelstown", "lancaster-gas-techs", "martin-tree-hummelstown", "martins-tree-harrisburg", "moss-tree-mechanicsburg", "nestwell-lancaster", "oak-shade-tree-quarryville", "pa-chimney", "papas-plumbing-lancaster", "reitz-home-lancaster", "snyder-tree-harrisburg", "spayds-industrial-elizabethtown", "sturdy-built-denver", "thompsons-property-harrisburg", "tri-county-chimney-johnstown", "zeiset-electric-manheim"];
  var picks = null;
  try { picks = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { picks = null; }
  if (!picks || typeof picks !== "object") { picks = {}; SEED.forEach(function (s) { picks[s] = "name"; }); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var grid = document.getElementById("grid");
  var countEl = document.getElementById("count");
  function count() { countEl.textContent = Object.keys(picks).filter(function (k) { return picks[k]; }).length; }
  function previewHref(s) { var v = picks[s]; return "/p/index.html?b=" + encodeURIComponent(s) + (v === "name" ? "&logoname=1" : v === "nologo" ? "&nologo=1" : ""); }
  function paint(card) {
    var s = card.getAttribute("data-s");
    card.classList.toggle("on", picks[s] === "name");
    card.classList.toggle("nologo", picks[s] === "nologo");
    card.querySelector(".meta a").setAttribute("href", previewHref(s));
  }
  fetch("/p/logo-list.json").then(function (r) { return r.json(); }).then(function (list) {
    var known = {}; list.forEach(function (x) { known[x.s] = 1; });
    Object.keys(picks).forEach(function (k) { if (!known[k]) delete picks[k]; });
    document.getElementById("total").textContent = list.length;
    grid.innerHTML = list.map(function (x) {
      var img = '<img loading="lazy" src="' + esc(x.u) + '" alt="">';
      var logo = x.b ? '<span class="badge" style="background:' + esc(x.b) + '">' + img + "</span>" : img;
      return '<div class="card" data-s="' + esc(x.s) + '"><div class="logo">' + logo + '</div>' +
        '<div class="pick"><button type="button" class="b-name" data-v="name">Has name</button><button type="button" class="b-nologo" data-v="nologo">Name only</button></div>' +
        '<div class="meta"><span>' + esc(x.n) + '</span><a href="#" target="_blank" rel="noopener">preview</a></div></div>';
    }).join("");
    Array.prototype.forEach.call(grid.querySelectorAll(".card"), paint);
    save(); count();
  });
  grid.addEventListener("click", function (e) {
    var btn = e.target.closest(".pick button"); if (!btn) return;
    var card = btn.closest(".card"); var s = card.getAttribute("data-s"); var v = btn.getAttribute("data-v");
    if (picks[s] === v) delete picks[s]; else picks[s] = v;
    paint(card); save(); count();
  });
  document.getElementById("copy").addEventListener("click", function () {
    var keys = Object.keys(picks).sort();
    var text = "LOGO PICKS " + JSON.stringify({ has_name: keys.filter(function (k) { return picks[k] === "name"; }), name_only: keys.filter(function (k) { return picks[k] === "nologo"; }) });
    var fb = document.getElementById("fallback");
    function showFallback() { fb.style.display = "block"; fb.value = text; fb.select(); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { var b = document.getElementById("copy"); b.textContent = "Copied. Paste it to Claude"; }, showFallback);
    } else { showFallback(); }
  });
})();
</script>
</body>
</html>
